; Tower multiplayer preset. Scaling values are percentages per additional player.
; Applied only to the tower runtime copy; passwords and original game settings are preserved.
[GAMEPLAY]
allow_invaders = 0
allow_summons = 1
always_spectate_on_death = 1
death_debuffs = 0

[SCALING]
enemy_health_scaling = 100
enemy_damage_scaling = 20
enemy_posture_scaling = 30
boss_health_scaling = 100
boss_damage_scaling = 20
boss_posture_scaling = 80
